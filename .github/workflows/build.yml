name: Build Splitora Desktop

# يشتغل بطريقتين:
# 1) يدوياً: من تبويب Actions اضغطي "Run workflow"
# 2) تلقائياً: عند رفع tag يبدأ بـ v (مثال: v1.0.0) — وساعتها بيعمل Release جاهز للتوزيع
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download yt-dlp (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p bin
          curl -L -o bin/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
        shell: bash

      - name: Download yt-dlp (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin
          curl -L -o bin/yt-dlp_macos https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x bin/yt-dlp_macos

      - name: Download yt-dlp (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin
          curl -L -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x bin/yt-dlp

      - name: Build whisper.cpp (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 --branch v1.7.4 https://github.com/ggerganov/whisper.cpp.git whisper-src
          cmake -S whisper-src -B whisper-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper-src/build --config Release -j
          mkdir -p bin
          find whisper-src/build -iname "whisper-cli.exe" -exec cp {} bin/whisper-cli.exe \;
        shell: bash

      - name: Build whisper.cpp (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch v1.7.4 https://github.com/ggerganov/whisper.cpp.git whisper-src
          cmake -S whisper-src -B whisper-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper-src/build --config Release -j
          mkdir -p bin
          find whisper-src/build -iname "whisper-cli" -type f -exec cp {} bin/whisper-cli \;
          chmod +x bin/whisper-cli

      - name: Build whisper.cpp (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch v1.7.4 https://github.com/ggerganov/whisper.cpp.git whisper-src
          cmake -S whisper-src -B whisper-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper-src/build --config Release -j
          mkdir -p bin
          find whisper-src/build -iname "whisper-cli" -type f -exec cp {} bin/whisper-cli \;
          chmod +x bin/whisper-cli

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          # يمنع فشل البناء على ماك بسبب توقيع الكود (مش محتاجينه للتوزيع المجاني)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Splitora-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore

  release:
    # ينشئ صفحة Release بالملفات تلقائياً عند رفع tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
